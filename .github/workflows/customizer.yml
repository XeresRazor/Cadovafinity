name: Customizer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Reads the list of customizers from .github/site-layout.json, the one place that lists them.
  layout:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
    - uses: actions/checkout@v4
    - id: matrix
      run: |
        echo "matrix=$(jq -c '{include: .}' .github/site-layout.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: layout
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.layout.outputs.matrix) }}
    steps:
    - uses: actions/checkout@v4
    - id: customizer
      uses: tomasf/Cadova/Actions/BuildCustomizer@1.3.0
      with:
        package-path: ${{ matrix.package-path }}
        product: ${{ matrix.product }}
        upload-pages-artifact: 'false'
        output: Customizer
    - uses: actions/upload-artifact@v4
      with:
        name: site-${{ matrix.id }}
        path: ${{ steps.customizer.outputs.path }}
        if-no-files-found: error
        overwrite: true

  # Puts the built customizers together into one site and uploads it for Pages. This runs in its
  # own job, apart from the deployment: deploy-pages looks the artifact up by name in the workflow
  # run, and a job boundary gives the upload time to be listed before that lookup.
  assemble:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        pattern: site-*
        path: parts
    - run: bash .github/scripts/assemble-site.sh .github/site-layout.json parts _site lidded
    - uses: actions/upload-pages-artifact@v3
      with:
        path: _site

  deploy:
    needs: assemble
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
